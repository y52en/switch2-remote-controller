name: CI

on:
  push:
  pull_request:

jobs:
  host:
    name: Host tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  signaling:
    name: Worker dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:signaling

  firmware:
    name: Firmware profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native multi-controller unit tests
        run: >-
          cc -std=c11 -Wall -Wextra -Werror -pedantic
          -Ifirmware/esp32-c3/main/include
          firmware/esp32-c3/main/src/multi_controller.c
          firmware/esp32-c3/test/native_multi_controller.c
          -o /tmp/multi-controller-test && /tmp/multi-controller-test
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.18
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/firmware.py build --profile headless
      - run: uv run --frozen python scripts/firmware.py build --profile lcd-2424s012c
      - run: uv run --frozen python scripts/check_public_tree.py
